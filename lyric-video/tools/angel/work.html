<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;background:#000;width:1080px;height:1080px;overflow:hidden}
#stage{position:relative;width:1080px;height:1080px;overflow:hidden;background:#05060c}
svg#main{position:absolute;left:0;top:0;width:1080px;height:1080px}
svg text{font-family:'Fira Sans','Montserrat','Inter',sans-serif;font-weight:800}
#cap{position:absolute;left:90px;top:112px;width:900px;display:flex;flex-wrap:wrap;justify-content:center;text-align:center;align-content:flex-start;
  font-family:'Fira Sans','Montserrat','Inter',sans-serif;font-weight:800;color:#fff;line-height:1.28;letter-spacing:.01em;gap:.1em .22em;text-shadow:0 2px 10px rgba(0,0,0,.45)}
#cap .w{display:inline-block;transform-origin:50% 60%;white-space:nowrap}
#cap .p{display:inline-block;padding:0 .24em;border-radius:.2em;text-shadow:none;font-weight:900}
</style></head>
<body><div id="stage">
<svg id="main" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
<defs>
 <radialGradient id="gSpark"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".3" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <radialGradient id="vig" cx=".5" cy=".5" r=".8"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
 <linearGradient id="gCy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38e0ff"/><stop offset="1" stop-color="#3a6bff"/></linearGradient>
 <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#e59a12"/></linearGradient>
 <filter id="fG" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="fS" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="26"/></filter>
 <clipPath id="clipL"><polygon points="-80,-60 3,-60 -7,-30 7,-8 -5,14 5,40 0,60 -80,60"/></clipPath>
 <clipPath id="clipR"><polygon points="80,-60 3,-60 -7,-30 7,-8 -5,14 5,40 0,60 80,60"/></clipPath>
 <clipPath id="clipRes"><rect x="0" y="168" width="920" height="472"/></clipPath>
 <clipPath id="clipWin"><rect x="200" y="90" width="520" height="430" rx="14"/></clipPath><clipPath id="clipGlass"><path d="M140 140 L400 140 L360 500 Q270 530 180 500 Z"/></clipPath><clipPath id="clipCom"><rect x="0" y="96" width="920" height="400"/></clipPath>
</defs>
<g id="bgLayer"></g><g id="panelG"></g><g id="npG"></g>
</svg>
<div id="cap"></div>
</div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};
const eo=x=>1-Math.pow(1-clamp(x),3);
const backO=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const f=n=>(+n).toFixed(2);
const fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const pct=v=>Math.round(clamp(v)*100)+'%';
const T=(x,y,s,size,o={})=>`<text x="${x}" y="${y}" font-size="${size}" fill="${o.fill||'#fff'}" opacity="${o.op??1}" text-anchor="${o.a||'start'}" style="font-weight:${o.w||800};letter-spacing:${o.ls||0}px;${o.ff?`font-family:${o.ff};`:''}${o.it?'font-style:italic;':''}">${s}</text>`;
const COL={pk:'#ff5c9c',gr:'#3ee08f',vi:'#9b7bff',bl:'#3aa8ff',ye:'#ffc933',rd:'#ff4d5e',cy:'#38e0ff',or:'#ff8a3d'};

/* ---- hearts ---- */
const HP="M0 40 C-60 -5 -35 -45 0 -15 C35 -45 60 -5 0 40 Z";
const heartIcon=(x,y,s,col,op=1,rot=0)=>`<g transform="translate(${f(x)} ${f(y)}) rotate(${f(rot)}) scale(${f(s/50)})" opacity="${f(op)}"><path d="${HP}" fill="${col}"/></g>`;
function brokenIcon(x,y,s,col,op,rot,gap){const h=(sd,cl)=>`<g transform="translate(${f(sd*gap*9)} ${f(gap*3)}) rotate(${f(sd*gap*9)})"><path clip-path="url(#${cl})" d="${HP}" fill="${col}"/></g>`;
  return `<g transform="translate(${f(x)} ${f(y)}) rotate(${f(rot)}) scale(${f(s/50)})" opacity="${f(op)}">${h(-1,'clipL')}${h(1,'clipR')}</g>`}
const HEARTS=Array.from({length:30},(_,i)=>[0.8+i*1.9,[150,930,880,110,910,180,850,120,930,170][i%10],[40,34,44,32,38,46,34,40,44,34][i%10],i%4===0?0:1]);
function hearts(t){let o='';HEARTS.forEach((h,i)=>{const age=t-h[0];if(age<0||age>7)return;
  const y=1180-age/7*1350,x=h[1]+30*Math.sin(age*1.1+i),op=.85*Math.min(1,age/1,(7-age)/1.2),rot=8*Math.sin(age*.9+i);
  o+=`<g filter="url(#fG)">`+((h[3]&&age>1.6)?brokenIcon(x,y,h[2],'#d8d8e8',op*.5,rot,clamp((age-1.6)/1.6)):heartIcon(x,y,h[2],'#d8d8e8',op*.5,rot))+`</g>`});
  return o}

/* ---- backgrounds per scene: [top,bottom,glow] ---- */
document.getElementById('main').style.filter='saturate(.55) brightness(.95)';
const BGS=[['#060608','#1a1a24','#9a8aa8'],['#060608','#1a1a24','#a04a5a'],['#060608','#1a1a24','#c8a050'],['#060608','#1a1a24','#7a6ab0'],['#060608','#1a1a24','#cfe0ff'],['#060608','#1a1a24','#4a6ab0'],['#060608','#1a1a24','#a04a5a'],['#060608','#1a1a24','#7a6ab0']];
document.getElementById('main').querySelector('defs').insertAdjacentHTML('beforeend',BGS.map((b,i)=>`<linearGradient id="bgS${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${b[0]}"/><stop offset=".42" stop-color="${b[0]}"/><stop offset="1" stop-color="${b[1]}"/></linearGradient><radialGradient id="glS${i}"><stop offset="0" stop-color="${b[2]}" stop-opacity=".5"/><stop offset="1" stop-color="${b[2]}" stop-opacity="0"/></radialGradient>`).join(''));
function bgScene(i,t,op){
  let o=`<g opacity="${f(op)}"><rect width="1080" height="1920" fill="url(#bgS${i})"/>`;
  o+=`<circle cx="${f(540+200*Math.sin(t*.22+i))}" cy="${f(760+90*Math.cos(t*.18+i))}" r="780" fill="url(#glS${i})"/>`;
  o+=`<circle cx="${f(200+120*Math.cos(t*.15+i*2))}" cy="${f(520+70*Math.sin(t*.2))}" r="420" fill="url(#glS${i})" opacity=".55"/>`;
  for(let k=0;k<26;k++){const r=2+hash(k+i*30)*5,x=(hash(k+i*30+9)*1080+16*Math.sin(t*.5+k))%1080,y=1920-((t*(12+hash(k+i*30+3)*24)+hash(k+i*30+5)*1920)%1920);
    o+=`<circle cx="${f(x)}" cy="${f(y)}" r="${f(r*2.4)}" fill="url(#gSpark)" opacity="${f((.15+.5*Math.pow(Math.sin(t*1.1+k*2),2))*.8)}"/>`}
  return o+`</g>`}

/* ---- ui helpers (card-local 920x640) ---- */
const CW=920,CH=640;
function shell(theme,inner){
  const L=theme==='light';
  return `<rect x="12" y="34" width="${CW-24}" height="${CH}" rx="44" fill="#000" opacity="${L?.28:.4}" filter="url(#fS)"/>
  <rect width="${CW}" height="${CH}" rx="44" fill="${L?'#f5f7fb':'#10121b'}" fill-opacity="${L?1:.93}"/>
  ${L?'':`<rect x="1.5" y="1.5" width="${CW-3}" height="${CH-3}" rx="43" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="3"/>`}${inner}`}
const chip=(cx,cy,txt,col,size=28,tc='#0a0f08')=>{const w=txt.length*size*.66+44;return `<g filter="url(#fG)"><rect x="${f(cx-w/2)}" y="${cy-size*.95}" width="${f(w)}" height="${size*1.9}" rx="${size*.6}" fill="${col}"/></g>`+T(cx,cy+size*.36,txt,size,{a:'middle',w:900,fill:tc})};
function stamp(txt,x,y,rot,u,col=COL.rd,size=50){if(u<0)return'';const s=lerp(2.4,1,eo(u*4)),op=clamp(u*6),w=txt.length*size*.66+44;
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${f(s)})" opacity="${f(op)}"><rect x="${f(-w/2)}" y="${-size*.95}" width="${f(w)}" height="${size*1.9}" rx="10" fill="#1c0508" fill-opacity=".78" stroke="${col}" stroke-width="5"/>${T(0,size*.36,txt,size,{a:'middle',w:900,fill:col})}</g>`}
const avatar=(x,y,r,col)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${col}" fill-opacity=".28"/><circle cx="${x}" cy="${f(y-r*.2)}" r="${f(r*.4)}" fill="${col}"/><path d="M${f(x-r*.68)} ${f(y+r*.72)} Q${f(x-r*.68)} ${f(y+r*.2)} ${x} ${f(y+r*.2)} Q${f(x+r*.68)} ${f(y+r*.2)} ${f(x+r*.68)} ${f(y+r*.72)}Z" fill="${col}"/>`;
const sparkle=(x,y,s,op)=>`<path d="M${x} ${y-s} Q${x+s*.15} ${y-s*.15} ${x+s} ${y} Q${x+s*.15} ${y+s*.15} ${x} ${y+s} Q${x-s*.15} ${y+s*.15} ${x-s} ${y} Q${x-s*.15} ${y-s*.15} ${x} ${y-s}Z" fill="#fff" opacity="${f(op)}"/>`;
const typed=(s,lt,t0,dur)=>s.slice(0,Math.floor(clamp((lt-t0)/dur)*s.length));
const caret=lt=>Math.floor(lt*2.5)%2?'|':'';
const star=(x,y,r,col,op=1)=>`<polygon transform="translate(${x} ${y})" points="0,${-r} ${r*.3},${-r*.3} ${r},${-r*.25} ${r*.5},${r*.15} ${r*.62},${r} 0,${r*.55} ${-r*.62},${r} ${-r*.5},${r*.15} ${-r},${-r*.25} ${-r*.3},${-r*.3}" fill="${col}" opacity="${op}"/>`;
const tick=(x,y,col)=>`<path d="M${x} ${y} l7 8 l14 -16 M${x+11} ${y} l7 8 l14 -16" fill="none" stroke="${col}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`;
const searchBar=(txt,lt,light)=>`<rect x="40" y="36" width="840" height="84" rx="42" fill="${light?'#fff':'#fff'}" fill-opacity="${light?1:.1}" stroke="#000" stroke-opacity=".08" stroke-width="2"/><circle cx="94" cy="76" r="16" fill="none" stroke="#6b7280" stroke-width="5"/><path d="M106 88 L120 102" stroke="#6b7280" stroke-width="5" stroke-linecap="round"/>`+T(144,89,txt+caret(lt),38,{fill:'#1b1f2a',w:700})+`<circle cx="836" cy="78" r="26" fill="#3aa8ff" fill-opacity=".15"/><rect x="829" y="62" width="14" height="26" rx="7" fill="#3a7bff"/>`;

/* ---- scenes ---- */
const snow=(x,y,r,rot,op=1,col='#fff')=>`<g transform="translate(${f(x)} ${f(y)}) rotate(${f(rot)})" opacity="${op}" stroke="${col}" stroke-width="${f(r*.12)}" stroke-linecap="round" fill="none">`+[0,60,120].map(a=>`<path transform="rotate(${a})" d="M0 ${-r} V${r} M${-r*.28} ${-r*.7} L0 ${-r*.45} L${r*.28} ${-r*.7} M${-r*.28} ${r*.7} L0 ${r*.45} L${r*.28} ${r*.7}"/>`).join('')+`</g>`;
const FLAME="M0 -62 C22 -30 42 -20 42 10 C42 40 22 62 0 62 C-22 62 -42 40 -42 10 C-42 -10 -26 -20 -16 -42 C-12 -26 -5 -20 0 -62Z";
const barRow=(x,y,w,label,val,valTxt,col)=>T(x,y,label,18,{ls:2,op:.7})+T(x+w,y,valTxt,22,{a:'end',w:900,fill:col})+`<rect x="${x}" y="${y+12}" width="${w}" height="14" rx="7" fill="#fff" fill-opacity=".12"/><rect x="${x}" y="${y+12}" width="${f(Math.max(0,w*clamp(val)))}" height="14" rx="7" fill="${col}" filter="url(#fG)"/>`;
const sunI=(x,y,r,rot)=>`<g transform="translate(${x} ${y}) rotate(${f(rot)})"><circle r="${r}" fill="url(#gGold)"/>`+Array.from({length:8},(_,i)=>`<path transform="rotate(${i*45})" d="M0 ${-r-8} V${-r-20}" stroke="#ffd27a" stroke-width="5" stroke-linecap="round"/>`).join('')+`</g>`;
const GH="M-40 40 V-10 C-40 -50 -20 -70 0 -70 C20 -70 40 -50 40 -10 V40 L25 28 L10 40 L-5 28 L-20 40 L-30 28 Z";
const FLAME2="M0 -62 C22 -30 42 -20 42 10 C42 40 22 62 0 62 C-22 62 -42 40 -42 10 C-42 -10 -26 -20 -16 -42 C-12 -26 -5 -20 0 -62Z";
const LORA="'Lora',serif";
const ringsAt=(x,y,u,col,R=200,n=2)=>{let o='';for(let k=0;k<n;k++){const p=(u-k*.1)/.6;if(p<=0||p>=1)continue;o+=`<circle cx="${x}" cy="${y}" r="${f(lerp(16,R,eo(p)))}" fill="none" stroke="${col}" stroke-width="${f(lerp(9,1,p))}" opacity="${f((1-p)*.9)}"/>`}return o};
const popIn=(x,y,u,inner)=>u<0?'':`<g transform="translate(${x} ${y}) scale(${f(backO(u/.22))}) translate(${-x} ${-y})">${inner}</g>`;
const sfx=(x,y,u,txt,size,col,rot=-6)=>popIn(x,y,u,`<g transform="rotate(${rot} ${x} ${y})">`+T(x,y+size*.35,txt,size,{a:'middle',w:900,fill:col})+`</g>`);
const flash=(x,y,u)=>u<0||u>.5?'':`<circle cx="${x}" cy="${y}" r="${f(20+u*160)}" fill="#fff" opacity="${f(.9*(1-u*2))}"/>`+sparkle(x,y,+(30*(1-u*2)).toFixed(1),1-u*2);
const wings=(x,y,s,op=1)=>{let o=`<g transform="translate(${x} ${y}) scale(${s})" opacity="${f(op)}">`;for(const sd of[-1,1])for(let k=0;k<5;k++)o+=`<path d="M0 0 Q${sd*(60+k*22)} ${-60+k*18} ${sd*(110+k*26)} ${-20+k*30} Q${sd*(70+k*16)} ${10+k*14} 0 ${10+k*6}Z" fill="#eef2fa" opacity="${f(.95-k*.12)}"/>`;return o+`</g>`};
/* ---- detailed girl face ---- */
function girlFace(cx,cy,s,o){o=o||{};const sk=o.skin||'#f6d8c8',id=o.id||'gf';let g=`<g transform="translate(${cx} ${cy}) scale(${s})">`;
  g+=`<radialGradient id="${id}sk" cx=".5" cy=".42" r=".6"><stop offset="0" stop-color="#fde8dc"/><stop offset="1" stop-color="${sk}"/></radialGradient>`;
  g+=`<path d="M-62 -10 C-64 -70 -30 -98 0 -98 C30 -98 64 -70 62 -10 C60 30 36 70 0 80 C-36 70 -60 30 -62 -10Z" fill="url(#${id}sk)"/>`;
  g+=`<ellipse cx="-34" cy="22" rx="16" ry="9" fill="#ff8aa8" opacity=".35"/><ellipse cx="34" cy="22" rx="16" ry="9" fill="#ff8aa8" opacity=".35"/>`;
  g+=`<path d="M-44 -30 Q-30 -40 -14 -32" stroke="${o.brow||'#5a3a2a'}" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M44 -30 Q30 -40 14 -32" stroke="${o.brow||'#5a3a2a'}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  if(o.closed){for(const sd of[-1,1]){g+=`<path d="M${sd*42} -8 Q${sd*28} 2 ${sd*14} -8" stroke="#3a2420" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;for(let k=0;k<4;k++){const x=sd*(40-k*8);g+=`<path d="M${x} ${-6+Math.abs(k-1.5)*-1} l${sd*-2} 7" stroke="#3a2420" stroke-width="2" stroke-linecap="round"/>`}}}
  else{for(const sd of[-1,1]){const ex=sd*28;g+=`<ellipse cx="${ex}" cy="-10" rx="15" ry="${f(10*(o.blink??1))}" fill="#fff"/><circle cx="${ex+sd*1}" cy="-9" r="${f(8*(o.blink??1))}" fill="${o.iris||'#5a3a2a'}"/><circle cx="${ex+sd*1}" cy="-9" r="${f(4*(o.blink??1))}" fill="#1a1010"/><circle cx="${ex+sd*1+3}" cy="-13" r="2.6" fill="#fff"/>`;
      g+=`<path d="M${ex-16} -14 Q${ex} -26 ${ex+16} -14" stroke="#2a1818" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;for(let k=0;k<3;k++)g+=`<path d="M${ex+sd*(10+k*3)} ${-18+k*2} l${sd*6} -5" stroke="#2a1818" stroke-width="2" stroke-linecap="round"/>`}}
  g+=`<path d="M0 -2 Q-4 14 -6 20 Q0 24 6 20" stroke="#d8a898" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  g+=`<path d="M-16 40 Q-8 34 0 37 Q8 34 16 40 Q8 50 0 50 Q-8 50 -16 40Z" fill="${o.lip||'#e0607a'}"/><path d="M-16 40 Q0 44 16 40" stroke="#b03a52" stroke-width="1.5" fill="none"/><ellipse cx="4" cy="45" rx="4" ry="1.6" fill="#fff" opacity=".5"/>`;
  return g+`</g>`}

const SCENE1={d:4.18, theme:'dark',t:"ЭТА СУКА ВЫГЛЯДИТ КАК #КОШКА",pc:['pk'],ws:[.6,.90,1.36,1.94,2.42],
 draw:lt=>{const det=clamp(lt/1.3),on=ease((lt-1.4)/.5),cx=460,cy=300;
  let o=`<linearGradient id="cmBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c8d8"/><stop offset="1" stop-color="#b88ac8"/></linearGradient><linearGradient id="cmHair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2420"/><stop offset="1" stop-color="#1a1010"/></linearGradient><linearGradient id="cmEar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9ac0"/><stop offset="1" stop-color="#ff5c9c"/></linearGradient>`;
  o+=`<clipPath id="cmV"><rect x="40" y="40" width="840" height="490" rx="26"/></clipPath><g clip-path="url(#cmV)"><rect x="40" y="40" width="840" height="490" fill="url(#cmBg)"/>`;
  for(let k=0;k<8;k++)o+=`<circle cx="${f(80+hash(k)*760)}" cy="${f(70+hash(k+3)*430)}" r="${f(30+hash(k+6)*60)}" fill="#fff" opacity="${f(.06+.06*Math.sin(lt+k))}"/>`;
  // hair back + shoulders
  o+=`<path d="M${cx-130} 560 C${cx-150} 420 ${cx-140} 250 ${cx-90} 200 C${cx-60} 160 ${cx+60} 160 ${cx+90} 200 C${cx+140} 250 ${cx+150} 420 ${cx+130} 560Z" fill="url(#cmHair)"/>`;
  o+=`<path d="M${cx-200} 560 Q${cx-180} 450 ${cx-60} 430 L${cx+60} 430 Q${cx+180} 450 ${cx+200} 560Z" fill="#1c1c28"/><path d="M${cx-30} 380 L${cx-30} 432 Q${cx} 446 ${cx+30} 432 L${cx+30} 380Z" fill="#f0ccbc"/>`;
  o+=`<path d="M${cx-24} 446 Q${cx} 470 ${cx+24} 446" stroke="url(#gGold)" stroke-width="4" fill="none"/><circle cx="${cx}" cy="470" r="6" fill="url(#gGold)"/>`;
  const bl=Math.abs(Math.sin(lt*1.3))>.985?.15:1;
  o+=girlFace(cx,cy,1.35,{id:'g1',blink:bl});
  // bangs
  o+=`<path d="M${cx-86} ${cy-60} C${cx-90} ${cy-150} ${cx+90} ${cy-150} ${cx+86} ${cy-60} C${cx+60} ${cy-110} ${cx+20} ${cy-100} ${cx} ${cy-118} C${cx-20} ${cy-96} ${cx-60} ${cy-110} ${cx-86} ${cy-60}Z" fill="url(#cmHair)"/>`;
  for(let k=0;k<6;k++)o+=`<path d="M${cx-70+k*28} ${cy-120} q${-6+k*2} 40 ${-10+k*4} 70" stroke="#4a3028" stroke-width="2" fill="none" opacity=".7"/>`;
  // cat filter
  if(on>0){o+=`<g opacity="${f(on)}" transform="translate(0 ${f((1-on)*-30)})">`;
    for(const sd of[-1,1]){const bx=cx+sd*70,wob=Math.sin(lt*3+sd)*3;o+=`<g transform="rotate(${f(sd*(12+wob))} ${bx} ${cy-150})"><path d="M${bx-sd*44} ${cy-140} L${bx+sd*6} ${cy-250} L${bx+sd*46} ${cy-130}Z" fill="#2a2030" stroke="#fff" stroke-opacity=".6" stroke-width="3" stroke-linejoin="round"/><path d="M${bx-sd*24} ${cy-145} L${bx+sd*6} ${cy-220} L${bx+sd*30} ${cy-140}Z" fill="url(#cmEar)"/>`;
      for(let k=0;k<4;k++)o+=`<path d="M${bx+sd*(-8+k*8)} ${cy-150} l${sd*2} -${18+k*4}" stroke="#ffd0e4" stroke-width="2" opacity=".8"/>`;o+=`</g>`}
    for(const sd of[-1,1])for(let k=0;k<3;k++)o+=`<path d="M${cx+sd*44} ${cy+22+k*9} Q${cx+sd*100} ${cy+12+k*14} ${cx+sd*150} ${cy+6+k*20}" stroke="#2a2030" stroke-width="3" fill="none" stroke-linecap="round" opacity=".85"/>`;
    o+=`<path d="M${cx-12} ${cy+22} L${cx+12} ${cy+22} L${cx} ${cy+36}Z" fill="#2a2030"/>`;
    for(let k=0;k<8;k++){const ph=(lt*1.4+k*.27)%1;o+=sparkle(+(cx-200+hash(k)*400).toFixed(0),+(cy-200+hash(k+5)*300).toFixed(0),+(6+10*Math.sin(ph*Math.PI)).toFixed(1),Math.sin(ph*Math.PI))}
    o+=`</g>`}

SC[0]=SCENE1;SC[4]=SCENE5;
/* ---- now playing badge + progress (square format) ---- */
const NP={artist:'Юпи &amp; FORTUNA 812',title:'Ангел'};
const mmss=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function nowPlaying(t){let o='';for(let k=0;k<4;k++){const h=10+16*Math.abs(Math.sin(t*5.5+k*1.3));o+=`<rect x="${60+k*11}" y="${f(76-h)}" width="7" height="${f(h)}" rx="3" fill="#fff"/>`}
  o+=`<text x="114" y="76" font-size="27" style="font-weight:800"><tspan fill="#fff">${NP.artist}</tspan><tspan fill="#a8a8b8" style="font-weight:600"> · ${NP.title}</tspan></text>`;
  const p=clamp(t/TOTAL);o+=`<rect x="163" y="886" width="754" height="7" rx="3.5" fill="#fff" fill-opacity=".18"/><rect x="163" y="886" width="${f(754*p)}" height="7" rx="3.5" fill="#fff" fill-opacity=".85"/>`;
  o+=T(163,930,mmss(t),22,{w:600,fill:'#a8a8b8'})+T(917,930,'-'+mmss(TOTAL-t),22,{a:'end',w:600,fill:'#a8a8b8'});return o}
const LINES=SC;let acc=0;LINES.forEach(l=>{l.st=acc;acc+=l.d});
const TOTAL=acc,FADE=.4,WORD=.11,W0=.2;
const PL={pk:[COL.pk,'#fff'],gr:[COL.gr,'#06210f'],vi:[COL.vi,'#fff'],bl:[COL.bl,'#04182b'],ye:[COL.ye,'#1c1500'],rd:[COL.rd,'#fff'],or:[COL.or,'#2a0f00'],cy:[COL.cy,'#04202a']};
const capEl=document.getElementById('cap');let capIdx=-1,capWords=[];
function parse(text){const toks=[];text.split(' ').forEach(w=>{const m=/^([#+]?)(.*?)([,.?!:;…]*)$/.exec(w);toks.push({mk:m[1],txt:m[2],tail:m[3]})});return toks}
function buildCap(i){capEl.innerHTML='';capWords=[];let k=-1;const L=LINES[i];
  parse(L.t).forEach(tk=>{const w=document.createElement('span');w.className='w';
    if(tk.mk){if(tk.mk==='#')k++;const c=PL[L.pc[Math.min(k,L.pc.length-1)]];const p=document.createElement('span');p.className='p';p.textContent=tk.txt;p.style.background=c[0];p.style.color=c[1];p.style.boxShadow=`0 0 28px ${c[0]}99`;w.appendChild(p);if(tk.tail)w.appendChild(document.createTextNode(tk.tail));}
    else w.textContent=tk.txt+tk.tail;
    w.style.opacity=0;capEl.appendChild(w);capWords.push(w)});
  let fs=52;capEl.style.fontSize=fs+'px';while(capEl.offsetHeight>136&&fs>32){fs-=2;capEl.style.fontSize=fs+'px'}}
function lineAt(t){let i=0;for(let j=0;j<LINES.length;j++)if(t>=LINES[j].st)i=j;return i}
const bgEl=document.getElementById('bgLayer'),pEl=document.getElementById('panelG');
function renderAt(t){
  const i=lineAt(t),lt0=t-LINES[i].st;
  let b='';if(i>0&&lt0<FADE){b=bgScene(i-1,t,1)+bgScene(i,t,ease(lt0/FADE))}else b=bgScene(i,t,1);
  bgEl.innerHTML=b+hearts(t)+`<rect width="1080" height="1080" fill="url(#vig)"/>`;
  let p=`<g transform="translate(163 262) scale(.82)">`;
  LINES.forEach((l,j)=>{const lt=t-l.st;if(lt<-1e-6||lt>l.d+FADE)return;
    const last=j===LINES.length-1,fi=clamp(lt/FADE),fo=last?1:clamp((l.d+FADE-lt)/FADE),op=Math.min(fi,fo);
    const dy=(1-eo(fi))*30-(1-fo)*20,bl=(1-fi)*14+(1-fo)*14;
    p+=`<g opacity="${f(op)}" transform="translate(0 ${f(dy)})" style="filter:blur(${f(bl)}px)">${shell(l.theme,l.draw(lt))}</g>`});
  pEl.innerHTML=p+`</g>`;
  document.getElementById('npG').innerHTML=nowPlaying(t);
  if(i!==capIdx){buildCap(i);capIdx=i}
  const lt=lt0;
  capWords.forEach((w,j)=>{const ws=LINES[i].ws?LINES[i].ws[j]:W0+WORD*j,u=(lt-ws)/.16;if(u<0){w.style.opacity=0;return}
    const bb=backO(u);w.style.opacity=Math.min(1,u*4);w.style.transform=`translateY(${(1-bb)*12}px) scale(${.82+.18*bb})`;w.style.filter=u<1?`blur(${f((1-clamp(u))*6)}px)`:'none'});
}
window.TOTAL=TOTAL;window.renderAt=renderAt;window.LINES=LINES;
