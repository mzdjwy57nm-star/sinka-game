<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;background:#000;width:1080px;height:1920px;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0d0710}
svg#main{position:absolute;left:0;top:0;width:1080px;height:1920px}
svg text{font-family:'Fira Sans','Inter',sans-serif}
#cap{position:absolute;left:60px;top:1110px;width:960px;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;
  font-family:'Fira Sans','Inter',sans-serif;font-weight:900;color:#fff;text-transform:uppercase;line-height:1.08;gap:.06em .22em;letter-spacing:.01em}
#cap .w{display:inline-block;transform-origin:50% 60%;white-space:nowrap}
#cap .p{display:inline-block;padding:0 .14em;border-radius:.08em}
</style></head>
<body><div id="stage">
<svg id="main" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
<defs>
 <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="glw" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g id="bg"></g><g id="obj"></g><g id="ui"></g>
</svg>
<div id="cap"></div>
</div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};
const eo=x=>1-Math.pow(1-clamp(x),3);
const backO=x=>{x=clamp(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const f=n=>(+n).toFixed(2);
const T=(x,y,s,size,o={})=>`<text x="${x}" y="${y}" font-size="${size}" fill="${o.fill||'#fff'}" opacity="${o.op??1}" text-anchor="${o.a||'middle'}" style="font-weight:${o.w||900};letter-spacing:${o.ls||0}px">${s}</text>`;
const PLATE={pk:['#ff2d6f','#fff'],ye:['#ffc62e','#1a1200'],vi:['#8a5cff','#fff'],cy:['#2ed0ff','#04202a'],rd:['#ff3048','#fff'],gr:['#2fd47a','#04210f']};
const shadow=(x,y,rx,op=.45)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${f(rx*.16)}" fill="#000" opacity="${op}" filter="url(#soft)"/>`;
const drop=(x,y,s,c='#e8173a')=>`<path transform="translate(${f(x)} ${f(y)}) scale(${s})" d="M0 -30 C14 -10 22 2 22 14 C22 28 12 36 0 36 C-12 36 -22 28 -22 14 C-22 2 -14 -10 0 -30Z" fill="${c}"/><ellipse cx="${f(x-7*s)}" cy="${f(y+8*s)}" rx="${f(4*s)}" ry="${f(7*s)}" fill="#fff" opacity=".5"/>`;
const sneaker=(stain)=>{let o=shadow(0,190,300)+`<path d="M-290 80 Q-290 -10 -200 -30 L-40 -70 Q20 -10 170 10 Q290 30 290 90 V120 H-290Z" fill="#fbf7f0"/><path d="M-290 120 H290 V150 Q290 170 270 170 H-270 Q-290 170 -290 150Z" fill="#e8e0d4"/><path d="M-290 130 H290" stroke="#ff2d6f" stroke-width="10"/><path d="M-200 -30 L-40 -70 Q-30 -40 -10 -20 L-180 20Z" fill="#efe6da"/>`;
  for(let k=0;k<4;k++)o+=`<path d="M${-150+k*40} ${-34+k*-8} l40 50" stroke="#c8beb0" stroke-width="8" stroke-linecap="round"/>`;
  for(let k=0;k<6;k++){const r=stain*(14+hash(k)*22);o+=`<circle cx="${f(-80+hash(k+2)*260)}" cy="${f(10+hash(k+5)*80)}" r="${f(r)}" fill="#e8173a"/>`}return o};
const POP=(v)=>[
{d:2.76,glow:'#ff2d6f',t:"Кровь на #кроссовках стекла с #губ",pc:['pk','rd'],ws:v?[.0,.82,.90,1.66,2.18,2.38]:[.0,.78,.92,1.64,2.20,2.38],
 draw:lt=>{const st=ease((lt-1.6)/.9);let o=`<g transform="translate(0 60)">${sneaker(st)}</g>`;
  for(let k=0;k<3;k++){const q=clamp((lt-1.5-k*.25)/.6);if(q>0&&q<1)o+=drop(-40+k*60,lerp(-320,70,q*q),1.4)}
  if(!v)o+=`<g transform="translate(0 -300)"><path d="M-110 0 Q-60 -40 0 -20 Q60 -40 110 0 Q60 50 0 46 Q-60 50 -110 0Z" fill="#ff2d6f"/><path d="M-110 0 Q0 18 110 0" stroke="#b0123e" stroke-width="5" fill="none"/></g>`;
  return o}},
{d:0.66,glow:'#ff5c8a',t:"#Соси,",pc:['pk'],ws:[.0],
 draw:lt=>{const r=lt*200;return shadow(0,300,120)+`<rect x="-12" y="40" width="24" height="250" rx="12" fill="#f6eedc"/><g transform="rotate(${f(r)})"><circle r="150" fill="#ff2d6f"/>`+[0,1,2,3,4,5].map(k=>`<path transform="rotate(${k*60})" d="M0 0 Q60 -40 0 -150" stroke="#fff" stroke-width="22" fill="none" opacity=".85"/>`).join('')+`<circle r="150" fill="none" stroke="#c8104e" stroke-width="10"/></g><ellipse cx="-60" cy="-70" rx="30" ry="16" fill="#fff" opacity=".5"/>`}},
{d:1.46,glow:'#3a7bff',t:"парковка, #клуб",pc:['vi'],ws:[.0,.66],
 draw:lt=>{const sw=lt>=.66;if(!sw)return shadow(0,330,160)+`<rect x="-14" y="80" width="28" height="250" fill="#8a8a96"/><rect x="-160" y="-220" width="320" height="320" rx="40" fill="#2f6bff"/><rect x="-140" y="-200" width="280" height="280" rx="28" fill="none" stroke="#fff" stroke-width="10"/>`+T(0,30,'P',240,{fill:'#fff'});
  const on=Math.floor(lt*7)%2;return shadow(0,250,260)+`<rect x="-260" y="-150" width="520" height="300" rx="40" fill="#1a1024" stroke="${on?'#ff2d6f':'#8a5cff'}" stroke-width="14" filter="url(#glw)"/>`+T(0,50,'CLUB',150,{fill:on?'#ff2d6f':'#8a5cff'})}},
{d:2.16,glow:'#8a5cff',t:"Она так любит этот #звук",pc:['vi'],ws:[.36,.60,.98,1.68,1.96],
 draw:lt=>{const b=1+.06*Math.abs(Math.sin(lt*9));let o=shadow(0,300,240);
  if(!v){o+=`<path d="M-180 60 Q-180 -230 0 -230 Q180 -230 180 60" stroke="#2a2440" stroke-width="40" fill="none" stroke-linecap="round"/><g transform="scale(${f(b)})"><rect x="-240" y="20" width="110" height="200" rx="50" fill="#8a5cff"/><rect x="130" y="20" width="110" height="200" rx="50" fill="#8a5cff"/><rect x="-224" y="40" width="40" height="160" rx="20" fill="#fff" opacity=".25"/></g>`}
  else{o+=`<rect x="-200" y="-260" width="400" height="520" rx="50" fill="#2a2440"/><circle cy="-120" r="70" fill="#1a1428"/><circle cy="-120" r="${f(36*b)}" fill="#8a5cff"/><circle cy="100" r="130" fill="#1a1428"/><circle cy="100" r="${f(80*b)}" fill="#8a5cff"/><circle cy="100" r="30" fill="#2a2440"/>`}
  for(let k=0;k<3;k++){const q=((lt*1.4)+k/3)%1;o+=`<path d="M${f(270+q*80)} -60 q40 80 0 160" stroke="#8a5cff" stroke-width="12" fill="none" stroke-linecap="round" opacity="${f(1-q)}"/><path d="M${f(-270-q*80)} -60 q-40 80 0 160" stroke="#8a5cff" stroke-width="12" fill="none" stroke-linecap="round" opacity="${f(1-q)}"/>`}
  return o}},
{d:v?2.68:1.56,glow:'#ffc62e',t:"Курю в отеле, #тур",pc:['ye'],ws:[.0,.64,.78,1.54],
 draw:lt=>{const sw=Math.sin(lt*2.5)*10;let o=shadow(0,330,180)+`<g transform="rotate(${f(sw)} 0 -260)"><path d="M0 -260 V-160" stroke="#c8beb0" stroke-width="8"/><rect x="-170" y="-170" width="340" height="460" rx="40" fill="#ffc62e"/><circle cy="-120" r="22" fill="#0d0710"/>`+T(0,40,'№',60,{fill:'#1a1200'})+T(0,170,v?'1212':'707',120,{fill:'#1a1200'})+`</g>`;
  for(let k=0;k<3;k++){const q=((lt*.5)+k/3)%1;o+=`<path d="M${f(220+Math.sin(q*6+k)*20)} ${f(120-q*300)} q24 -36 0 -72" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" opacity="${f(.5*(1-q))}"/>`}
  if(v&&lt>1.5){const C=['КАЗАНЬ','СОЧИ','ПИТЕР'];C.forEach((c,k)=>{const u=backO((lt-1.5-k*.1)/.25);o+=`<g transform="translate(${-260+k*260} -330) scale(${f(clamp(u,0,1.2))})"><rect x="-110" y="-34" width="220" height="68" rx="34" fill="#fff"/>`+T(0,14,c,32,{fill:'#1a1200'})+`</g>`})}
  return o}}];
const SC=[...POP(0),...POP(1)];
SC[5].draw=lt=>{const q=clamp((lt-1.5)/.5),st=ease((lt-1.9)/.7);let o=`<g transform="translate(0 60)">${sneaker(st)}</g>`;if(q<1)o+=drop(0,lerp(-420,40,q*q),2);else for(let k=0;k<8;k++){const a=-Math.PI*(.1+k*.1),d=eo((lt-2)/.4)*120;o+=`<circle cx="${f(Math.cos(a)*d)}" cy="${f(60+Math.sin(a)*d*.6)}" r="10" fill="#e8173a" opacity="${f(1-clamp((lt-2.3)/.4))}"/>`}return o};
SC[6].t="#Соси,";SC[6].draw=lt=>{const s=1+.05*Math.sin(lt*10);return shadow(0,300,140)+`<g transform="scale(${f(s)}) rotate(-20)"><rect x="-50" y="20" width="100" height="220" rx="16" fill="#2a2440"/><rect x="-44" y="-60" width="88" height="90" rx="10" fill="#d8d0e0"/><path d="M-40 -60 L-40 -190 Q0 -240 40 -170 L40 -60Z" fill="#ff2d6f"/></g>`};
SC[7].draw=lt=>{const on=Math.floor(lt*4)%2;return shadow(0,250,150)+`<rect x="-110" y="-200" width="220" height="380" rx="90" fill="#2a2440"/><circle cy="-90" r="46" fill="${on?'#ff2d6f':'#3a3450'}" filter="url(#glw)"/><rect x="-50" y="10" width="100" height="40" rx="20" fill="#3a3450"/><rect x="-50" y="80" width="100" height="40" rx="20" fill="#3a3450"/>`+T(0,-80,'',10)};
/* ===== end scenes ===== */
const NP={artist:'',title:''};
const LINES=SC;let acc=0;LINES.forEach(l=>{l.st=acc;acc+=l.d});const TOTAL=acc,FADE=.18;
function bg(t,i,lt){const L=LINES[i],c=L.glow||'#ff2d6f',P=LINES[i-1];let o=`<rect width="1080" height="1920" fill="${L.light?'#f6eedc':'#0d0710'}"/>`;
  const g=(col,op)=>`<radialGradient id="g${col.slice(1)}" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="${col}" stop-opacity="${L.light?.0:.55}"/><stop offset=".55" stop-color="${col}" stop-opacity="${L.light?0:.16}"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></radialGradient><ellipse cx="540" cy="820" rx="760" ry="900" fill="url(#g${col.slice(1)})" opacity="${f(op)}"/>`;
  if(P&&lt<FADE*2)o+=g(P.glow||'#ff2d6f',1-lt/(FADE*2));o+=g(c,clamp(lt/(FADE*2)));
  if(!L.light)for(let k=0;k<40;k++){const x=hash(k)*1080,y=(hash(k+40)*1920+t*(6+hash(k+80)*10))%1920;o+=`<circle cx="${f(x)}" cy="${f(y)}" r="${f(1+hash(k+9)*1.6)}" fill="#fff" opacity="${f(.12+.25*Math.abs(Math.sin(t+k)))}"/>`}
  return o}
function ui(t,i){const L=LINES[i],dark=!L.light,fg=dark?'#fff':'#111',p=clamp(t/TOTAL);let o='';
  if(NP.artist)o+=T(540,96,`♪ ${NP.artist} · ${NP.title}`,22,{w:700,fill:fg,op:.7});
  o+=`<rect x="140" y="1590" width="800" height="5" rx="2.5" fill="${fg}" opacity=".2"/><rect x="140" y="1590" width="${f(800*p)}" height="5" rx="2.5" fill="${fg}" opacity=".85"/><circle cx="${f(140+800*p)}" cy="1592.5" r="9" fill="${fg}"/>`;
  return o}
const capEl=document.getElementById('cap');let capIdx=-1,capWords=[];
function buildCap(i){capEl.innerHTML='';capWords=[];let k=-1;const L=LINES[i];
  L.t.split(' ').forEach(w=>{const m=/^([#+]?)(.*)$/.exec(w);const el=document.createElement('span');el.className='w';
    if(m[1]){if(m[1]==='#')k++;const c=PLATE[L.pc[Math.min(k,L.pc.length-1)]];const p=document.createElement('span');p.className='p';p.textContent=m[2];p.style.background=c[0];p.style.color=c[1];el.appendChild(p);el.dataset.plate=1}else el.textContent=m[2];
    el.style.opacity=0;capEl.appendChild(el);capWords.push(el)});
  let fs=92;capEl.style.fontSize=fs+'px';while(capEl.offsetHeight>320&&fs>56){fs-=4;capEl.style.fontSize=fs+'px'}}
function lineAt(t){let i=0;for(let j=0;j<LINES.length;j++)if(t>=LINES[j].st)i=j;return i}
function renderAt(t){const i=lineAt(t),L=LINES[i],lt=t-L.st;
  if(i!==capIdx){buildCap(i);capIdx=i}
  document.getElementById('bg').innerHTML=bg(t,i,lt);
  // object: pop in, slide/blur out at the end
  const pin=backO(lt/.32),out=clamp((lt-(L.d-.16))/.16),ox=out*-620,bl=out*18+(1-clamp(lt/.15))*10;
  document.getElementById('obj').innerHTML=`<g transform="translate(${f(540+ox)} 700) scale(${f(pin*(1-out*.2))})" style="filter:blur(${f(bl)}px)" opacity="${f(clamp(lt/.1)*(1-out*.6))}">${L.draw(lt)}</g>`;
  document.getElementById('ui').innerHTML=ui(t,i);
  capEl.style.color=L.light?'#111':'#fff';
  capEl.style.transform=`translateX(${f(out*-500)}px)`;capEl.style.filter=out>0?`blur(${f(out*14)}px)`:'none';
  capWords.forEach((w,j)=>{const ws=L.ws?L.ws[j]:.12+.11*j,u=(lt-ws)/.16;if(u<0){w.style.opacity=0;return}
    const b=backO(u);w.style.opacity=Math.min(1,u*3);w.style.transform=`scale(${f(.6+.4*b)})`;w.style.filter=u<1?`blur(${f((1-clamp(u))*8)}px)`:'none';
    if(w.dataset.plate){const p=w.firstChild;p.style.clipPath=`inset(0 ${f((1-eo(u))*100)}% 0 0)`}});
}
window.TOTAL=TOTAL;window.renderAt=renderAt;window.LINES=LINES;
document.fonts.ready.then(()=>{renderAt(0);window.READY=true});
</script></body></html>
